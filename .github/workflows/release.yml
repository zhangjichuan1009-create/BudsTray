name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Build packages
        shell: pwsh
        run: ./scripts/Build.ps1 -MakeNsis 'C:/Program Files (x86)/NSIS/makensis.exe'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BudsTray-windows-x64
          path: |
            artifacts/BudsTray-Setup-*.exe
            artifacts/BudsTray-win-x64.zip
            artifacts/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'An existing verified release is kept unchanged.'
          } else {
            gh release create '${{ github.ref_name }}' artifacts/BudsTray-Setup-*.exe artifacts/BudsTray-win-x64.zip artifacts/SHA256SUMS.txt --title 'Buds Tray ${{ github.ref_name }}' --generate-notes --verify-tag
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
